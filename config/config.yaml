# config/config.yaml
# Central configuration for the AMR Genomics Pipeline
# BioProject: PRJNA838568
# Source: Uwanibe et al. 2024, Microorganisms
# 19 paired-end Illumina MiSeq WGS runs, Enterobacteriaceae
# Osun State, Nigeria (ACEGID, Redeemer's University)

samples_file: "config/accessions.txt"

# Output directories
dirs:
  raw:          "data/raw"
  trimmed:      "data/trimmed"
  qc:           "results/qc"
  assembly:     "results/assembly"
  assembly_qc:  "results/assembly_qc"
  annotation:   "results/annotation"
  amr:          "results/amr"
  plasmid:      "results/plasmid"
  integrated:   "results/integrated"
  logs:         "logs"

# Compute
threads: 4

# ABRicate databases
abricate_dbs:
  - card
  - resfinder
  - ncbi

# fastp trimming thresholds
# Phred quality score of 20 = 99% base call accuracy
# Reads shorter than 50 bp after trimming are discarded
fastp:
  min_quality: 20
  min_length:  50

# Assembly QC thresholds (your own, for comparison with the paper's thresholds)
assembly_qc:
  min_n50:      20000
  max_contigs:  300
